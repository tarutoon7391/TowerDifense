<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷宮の守護者 - 迷路建築タワーディフェンス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <h1>迷宮の守護者</h1>
      <div class="stats">
        <span class="stat"><span class="icon gold"></span>お金 <b id="money">0</b></span>
        <span class="stat"><span class="icon heart"></span>ライフ <b id="lives">0</b></span>
        <span class="stat">ウェーブ <b id="wave">0</b> / <span id="waveTotal">10</span></span>
        <span class="stat phase" id="phase">準備中</span>
      </div>
    </header>

    <main>
      <canvas id="game" width="800" height="480"></canvas>

      <aside id="panel">
        <h2>建築</h2>
        <div id="towerButtons" class="buttons">
          <!-- タワー選択ボタンは main.js が config から生成する -->
        </div>
        <button id="sellBtn" class="tool sell">売却モード<small>建設費の50%返金</small></button>

        <h2>ウェーブ</h2>
        <button id="startWaveBtn" class="primary">ウェーブ開始</button>
        <label class="speed">
          <input type="checkbox" id="speedToggle"> 2倍速
        </label>

        <div id="message" class="message"></div>

        <h2>操作</h2>
        <ul class="help">
          <li>左クリックで設置 / 売却</li>
          <li>右クリックで選択解除</li>
          <li>敵は常に最短経路を進むので、壁で迷路を作って足止めしよう</li>
          <li>経路を完全に塞ぐ配置はできない</li>
        </ul>
      </aside>
    </main>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <h2 id="overlayTitle"></h2>
        <p id="overlayBody"></p>
        <button id="restartBtn" class="primary">もう一度遊ぶ</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
